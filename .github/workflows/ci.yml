name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q -e ".[dev]"
      - run: ruff check src/senti tests && ruff format --check src/senti tests
      - run: pytest -q
