[project]
name = "senti"
version = "2.0.0"
description = "Benchmark of sentiment models on fresh, multilingual, neutral aware test data"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "pyarrow", "scikit-learn", "matplotlib", "torch", "transformers>=4.48", "huggingface_hub"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 160

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]  # long strings in tables; the formatter handles code
